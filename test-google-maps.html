<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Maps API Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        #map { height: 400px; width: 100%; border: 1px solid #ccc; margin: 20px 0; }
        .status { padding: 10px; border-radius: 4px; margin: 10px 0; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .warning { background: #fff3cd; color: #856404; }
        button { padding: 10px 20px; margin: 5px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>🗺️ Google Maps API Test</h1>
    
    <div id="status"></div>
    
    <button onclick="testApiKey()">Test API Key</button>
    <button onclick="testDirections()">Test Directions</button>
    <button onclick="getCurrentLocation()">Test Location</button>
    
    <div id="map"></div>
    
    <div id="results"></div>

    <script>
        // Your Google Maps API key
        const API_KEY = 'AIzaSyCxgmalqSC-2R9Y7kK0QkxrScDGXgw9AwY';
        
        function addStatus(message, type = 'success') {
            const statusDiv = document.getElementById('status');
            const div = document.createElement('div');
            div.className = `status ${type}`;
            div.innerHTML = message;
            statusDiv.appendChild(div);
        }

        function testApiKey() {
            if (!API_KEY || API_KEY === 'your_actual_api_key_here') {
                addStatus('❌ Please add your Google Maps API key to this test file', 'error');
                return;
            }

            // Test loading Google Maps API
            const script = document.createElement('script');
            script.src = `https://maps.googleapis.com/maps/api/js?key=${API_KEY}&libraries=places,geometry&callback=initMap`;
            script.onerror = () => addStatus('❌ Failed to load Google Maps API - check your API key', 'error');
            document.head.appendChild(script);
        }

        function initMap() {
            try {
                const map = new google.maps.Map(document.getElementById('map'), {
                    center: { lat: 37.7749, lng: -122.4194 }, // San Francisco
                    zoom: 13
                });

                const marker = new google.maps.Marker({
                    position: { lat: 37.7749, lng: -122.4194 },
                    map: map,
                    title: 'Test Location'
                });

                addStatus('✅ Google Maps loaded successfully!', 'success');
                addStatus('✅ Map rendered with marker', 'success');
            } catch (error) {
                addStatus(`❌ Error initializing map: ${error.message}`, 'error');
            }
        }

        function testDirections() {
            if (!window.google) {
                addStatus('❌ Google Maps not loaded. Test API key first.', 'error');
                return;
            }

            const directionsService = new google.maps.DirectionsService();
            
            directionsService.route({
                origin: 'San Francisco, CA',
                destination: 'Los Angeles, CA',
                travelMode: google.maps.TravelMode.DRIVING
            }, (result, status) => {
                if (status === 'OK') {
                    addStatus('✅ Directions API working!', 'success');
                    const route = result.routes[0];
                    addStatus(`📍 Route found: ${route.legs[0].distance.text}, ${route.legs[0].duration.text}`, 'success');
                } else {
                    addStatus(`❌ Directions API error: ${status}`, 'error');
                }
            });
        }

        function getCurrentLocation() {
            if (!navigator.geolocation) {
                addStatus('❌ Geolocation not supported by this browser', 'error');
                return;
            }

            addStatus('📍 Requesting location permission...', 'warning');
            
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    addStatus(`✅ Location found: ${lat.toFixed(4)}, ${lng.toFixed(4)}`, 'success');
                    
                    if (window.google) {
                        const map = new google.maps.Map(document.getElementById('map'), {
                            center: { lat, lng },
                            zoom: 15
                        });
                        
                        new google.maps.Marker({
                            position: { lat, lng },
                            map: map,
                            title: 'Your Location'
                        });
                    }
                },
                (error) => {
                    addStatus(`❌ Location error: ${error.message}`, 'error');
                }
            );
        }

        // Initial instructions
        addStatus('📋 Instructions:', 'warning');
        addStatus('1. Replace API_KEY in this file with your Google Maps API key', 'warning');
        addStatus('2. Click "Test API Key" to load Google Maps', 'warning');
        addStatus('3. Test other features once maps are loaded', 'warning');
    </script>
</body>
</html>
